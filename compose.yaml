services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hazard_demo}
      POSTGRES_USER: ${POSTGRES_USER:-hazard_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hazard_demo}
    ports:
      - "5432:5432"
    volumes:
      - hazard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hazard_demo} -d ${POSTGRES_DB:-hazard_demo}"]
      interval: 5s
      timeout: 3s
      retries: 20

  schema-sync:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: ["pnpm", "--filter", "@workspace/db", "run", "push"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hazard_demo}:${POSTGRES_PASSWORD:-hazard_demo}@postgres:5432/${POSTGRES_DB:-hazard_demo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hazard-engine:
    build:
      context: .
      dockerfile: Dockerfile.hazard-engine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hazard_demo}:${POSTGRES_PASSWORD:-hazard_demo}@postgres:5432/${POSTGRES_DB:-hazard_demo}
      HAZARD_SITE_ORIGIN_LAT: ${HAZARD_SITE_ORIGIN_LAT:-19.0000}
      HAZARD_SITE_ORIGIN_LON: ${HAZARD_SITE_ORIGIN_LON:-72.0000}
      HAZARD_STALE_TIMEOUT_SECONDS: ${HAZARD_STALE_TIMEOUT_SECONDS:-10}
    depends_on:
      schema-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/hazard-sim/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: ["pnpm", "--filter", "@workspace/api-server", "run", "dev"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hazard_demo}:${POSTGRES_PASSWORD:-hazard_demo}@postgres:5432/${POSTGRES_DB:-hazard_demo}
      HAZARD_ENGINE_URL: http://hazard-engine:8000/hazard-sim
    depends_on:
      schema-sync:
        condition: service_completed_successfully
      hazard-engine:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: ["pnpm", "--filter", "@workspace/aerial-hazard-detection", "run", "dev"]
    environment:
      PORT: "5173"
      BASE_PATH: /
    depends_on:
      - api-server

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-server
      - hazard-engine
      - web

volumes:
  hazard-postgres:
